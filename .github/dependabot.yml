version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
