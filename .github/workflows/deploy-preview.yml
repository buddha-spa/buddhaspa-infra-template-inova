name: Deploy Preview

on:
  pull_request:
    branches:
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Rewrite commit author for Vercel deploy authorization
        run: |
          git config user.name "adm-buddhaspa"
          git config user.email "adm.engenharia@buddhaspa.com.br"
          git commit --amend --no-edit --reset-author

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true
          working-directory: ./
          vercel-args: '--yes'
